<!DOCTYPE html>
<html lang="es">
<head>
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
  <script>google.charts.load('current', {packages:["orgchart"]});</script>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-8">

  <div class="max-w-6xl mx-auto">
    <h1 class="text-3xl font-bold text-gray-800 mb-6">Nomenclador de Puestos Municipal</h1>
    
    <input type="text" id="buscador" oninput="filtrar()" placeholder="🔎 Buscar cargo o área..." 
           class="w-full p-4 rounded-xl border border-gray-300 shadow-sm focus:ring-2 focus:ring-blue-500 mb-8">

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
      <div id="resultados" class="space-y-4 max-h-[600px] overflow-y-auto pr-2"></div>

      <div class="space-y-8">
        <div id="detalle" class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 hidden"></div>
        <div id="chart_div" class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 flex justify-center overflow-x-auto"></div>
      </div>
    </div>
  </div>

  <script>
    let datos = [];
    window.onload = () => google.script.run.withSuccessHandler(d => datos = d).obtenerDatos();

    function filtrar() {
      const q = document.getElementById('buscador').value.toLowerCase();
      const res = datos.filter(f => f.puesto.toLowerCase().includes(q) || f.area.toLowerCase().includes(q));
      document.getElementById('resultados').innerHTML = res.map(f => `
        <div onclick="mostrarDetalle('${f.codPuesto}')" class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 cursor-pointer hover:border-blue-500 transition">
          <p class="font-bold text-gray-800">${f.puesto}</p>
          <p class="text-sm text-gray-500">${f.area} • Cat: ${f.cat}</p>
        </div>
      `).join('');
    }

    function mostrarDetalle(cod) {
      const p = datos.find(x => x.codPuesto == cod);
      document.getElementById('detalle').classList.remove('hidden');
      document.getElementById('detalle').innerHTML = `
        <h2 class="text-2xl font-bold mb-4">${p.puesto}</h2>
        <div class="grid grid-cols-2 gap-4 text-sm">
          <p><strong>Área:</strong> ${p.area}</p>
          <p><strong>Categoría:</strong> ${p.cat}</p>
          <p class="col-span-2"><strong>Descripción:</strong> ${p.desc}</p>
          <p><strong>Titulación:</strong> ${p.titulo}</p>
          <p><strong>Inhibición:</strong> ${p.inhibicion}</p>
          <p class="col-span-2"><strong>Adicionales:</strong> ${p.ad1}, ${p.ad2}, ${p.ad3}</p>
        </div>
      `;
      dibujarOrg(p.area, p.puesto);
    }

    function dibujarOrg(area, puesto) {
      const data = new google.visualization.DataTable();
      data.addColumn('string', 'Puesto');
      data.addColumn('string', 'Padre');
      data.addRows([[{v: area, f: '<b>' + area + '</b>'}, ''], [puesto, area]]);
      new google.visualization.OrgChart(document.getElementById('chart_div')).draw(data, {allowHtml:true});
    }
  </script>
</body>
</html>
